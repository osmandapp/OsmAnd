/**
 * Every string of every locale, the source included, must survive the formatting the app applies to it:
 * String.format() with the arguments the source string implies - none when it has none, which is what
 * Resources.getString(id, args) does - and MessageFormat for the patterns with {n}. A translation must
 * also keep the placeholders of its source. Source strings with a literal '%' are marked formatted="false";
 * phrases.xml holds POI names read with getString(id) and is formatted only where the source has placeholders.
 */
class TranslationCheck {

	// java.util.Formatter grammar: %[argument_index$][flags][width][.precision][t]conversion
	static final java.util.regex.Pattern SPECIFIER = ~/%(\d+\$)?([-#+ 0,(<]*)?(\d+)?(\.\d+)?([tT])?([a-zA-Z%])/
	// a value every conversion accepts; 's', 'b' and 'h' take any object
	static final Map SAMPLES = [t: new Date(0L), d: 1, o: 1, x: 1, e: 1.0d, f: 1.0d, g: 1.0d, a: 1.0d, c: 'x' as char]

	/** What every locale of resDir gets wrong, checked against values/. */
	static List<String> validate(File resDir) {
		File defaults = new File(resDir, 'values')
		Map source = read(defaults)
		List<File> dirs = [defaults] + resDir.listFiles().findAll { it.directory && it.name.startsWith('values-') }.sort()
		dirs.collectMany { File dir ->
			read(dir).collectMany { name, entry -> source[name] ? check(dir.name, name, source[name], entry) : [] }
		}
	}

	/** name -> [file, formatted, other, texts] of the strings, plurals items and string-array items of one values directory. */
	static Map read(File dir) {
		Map entries = [:]
		['strings.xml', 'phrases.xml'].each { String fileName ->
			File file = new File(dir, fileName)
			if (!file.exists()) return
			new XmlParser().parse(file).children().each { node ->
				if (!(node instanceof Node)) return
				def texts = node.name() == 'string' ? [node.text()]
						: node.name() in ['plurals', 'string-array'] ? node.item*.text() : null
				if (texts != null) {
					entries[node.@name] = [file: fileName, texts: texts, formatted: node.@formatted != 'false',
					                       other: node.name() != 'plurals' || node.item.any { it.@quantity == 'other' }]
				}
			}
		}
		entries
	}

	/** What one entry of one locale gets wrong, each line naming the file and the string. */
	static List<String> check(String dir, String name, Map src, Map tr) {
		Set expected = src.texts.collectMany { placeholders(it) } as Set
		Object[] args = arguments(expected)
		// a source string with a literal '%' is not formatted, and phrases.xml is a POI name unless it has placeholders
		boolean formats = src.formatted && (src.file != 'phrases.xml' || expected)
		boolean isPattern = src.texts.any { it =~ /\{\s*\p{Nd}+/ }
		List<String> problems = tr.other ? [] : ['<plurals> without quantity="other" (Resources.NotFoundException)']
		tr.texts.each { String text ->
			String problem = formats ? formatting(text, args, expected, src.texts.size() == 1) : null
			if (!problem && isPattern) problem = parsing(text)
			if (problem) problems << "$problem: \"$text\"".toString()
		}
		problems.collect { "$dir/${src.file} '$name': $it".toString() }
	}

	/** The exception String.format() throws for this text, or the placeholders it changed, or null. */
	static String formatting(String text, Object[] args, Set expected, boolean single) {
		try {
			String.format(Locale.ROOT, text, args)
		} catch (Exception e) {
			return "${e.class.simpleName}: ${e.message}"
		}
		Set found = placeholders(text) as Set
		// one item of a plural or an array may use fewer placeholders than the entry as a whole
		boolean kept = single ? found == expected : expected.containsAll(found)
		kept ? null : "placeholders ${show(found)} instead of ${show(expected)}"
	}

	/** The exception MessageFormat throws for this pattern, or null. */
	static String parsing(String text) {
		try {
			new java.text.MessageFormat(text)
			null
		} catch (IllegalArgumentException e) {
			"MessageFormat: ${e.message}"
		}
	}

	/** [argument index, conversion] of every specifier that takes an argument; %s and %1$s both give [1, 's']. */
	static List placeholders(String text) {
		List found = []
		int ordinary = 0, last = 1
		(text =~ SPECIFIER).each { all, index, flags, width, precision, date, conversion ->
			if (conversion in ['%', 'n']) return
			last = index ? index[0..-2] as int : flags?.contains('<') ? last : ++ordinary
			found << [last, date ? 't' : conversion.toLowerCase()]
		}
		found
	}

	/** One value per argument the source string formats, of a type its conversion accepts. */
	static Object[] arguments(Set expected) {
		Object[] args = new Object[expected ? expected*.getAt(0).max() : 0]
		expected.each { args[it[0] - 1] = SAMPLES.get(it[1], 'x') }
		args
	}

	static String show(Set expected) {
		expected ? expected.collect { "%${it[0]}\$${it[1]}" }.sort().join(' ') : 'none'
	}
}

tasks.register('validateTranslations') {
	File resDir = file('res')
	def report = layout.buildDirectory.file('validateTranslations.txt')
	inputs.files(fileTree(resDir) { include 'values*/strings.xml', 'values*/phrases.xml' })
	outputs.file(report)
	doLast {
		List<String> errors = TranslationCheck.validate(resDir)
		if (errors) {
			errors.each { logger.error("ERROR: $it") }
			throw new GradleException("Translation validation failed with ${errors.size()} issue(s)")
		}
		report.get().asFile.text = 'Translations validated\n'
		logger.lifecycle('Translations validated')
	}
}

tasks.register('downloadWorldMiniBasemap', Download) {
	src 'https://builder.osmand.net/basemap/World_basemap_mini_2.obf'
