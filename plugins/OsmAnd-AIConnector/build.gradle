apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: rootProject.file("versions.gradle")

android {
	compileSdk osmand_compileSdk
	buildToolsVersion = osmand_buildToolsVersion
	namespace = "net.osmand.aiconnector"

	signingConfigs {
		development {
			storeFile file("../../keystores/debug.keystore")
			storePassword "android"
			keyAlias "androiddebugkey"
			keyPassword "android"
		}
		release {
			storeFile file("/var/lib/jenkins/osmand_key")
			storePassword System.getenv("OSMAND_APK_PASSWORD")
			keyAlias "osmand"
			keyPassword System.getenv("OSMAND_APK_PASSWORD")
		}
	}

	defaultConfig {
		applicationId "net.osmand.aiconnector"
		minSdkVersion Math.max(osmand_minSdk, 26)
		targetSdkVersion osmand_targetSdk
		versionCode 2
		versionName "0.4"
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

	kotlinOptions {
		jvmTarget = "17"
	}

	buildFeatures {
		buildConfig true
	}

	lintOptions {
		abortOnError false
	}

	sourceSets {
		main {
			manifest.srcFile "AndroidManifest.xml"
			java.srcDirs = ["src"]
			res.srcDirs = ["res"]
			assets.srcDirs = ["bridge", "assets"]
		}
		debug {
			res.srcDirs = ["res-debug"]
		}
	}

	buildTypes {
		debug {
			signingConfig signingConfigs.development
			// a debug build runs next to the released connector: own package, port and name
			applicationIdSuffix ".debug"
			buildConfigField "int", "MCP_PORT", "8766"
			buildConfigField "String", "SERVICE_SUFFIX", "\" (debug)\""
		}
		release {
			signingConfig signingConfigs.release
			buildConfigField "int", "MCP_PORT", "8765"
			buildConfigField "String", "SERVICE_SUFFIX", "\"\""
		}
	}
}

dependencies {
	implementation project(path: ':OsmAnd-api')
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.14.0'
	implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
