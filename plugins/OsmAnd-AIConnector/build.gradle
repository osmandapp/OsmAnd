apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: rootProject.file("versions.gradle")

android {
	compileSdk osmand_compileSdk
	buildToolsVersion = osmand_buildToolsVersion
	namespace = "net.osmand.aiconnector"

	signingConfigs {
		development {
			storeFile file("../../keystores/debug.keystore")
			storePassword "android"
			keyAlias "androiddebugkey"
			keyPassword "android"
		}
		release {
			storeFile file("/var/lib/jenkins/osmand_key")
			storePassword System.getenv("OSMAND_APK_PASSWORD")
			keyAlias "osmand"
			keyPassword System.getenv("OSMAND_APK_PASSWORD")
		}
	}

	defaultConfig {
		applicationId "net.osmand.aiconnector"
		minSdkVersion Math.max(osmand_minSdk, 26)
		targetSdkVersion osmand_targetSdk
		versionCode 3
		versionName "0.5"
	}

	packaging {
		jniLibs {
			// native libraries extracted to nativeLibraryDir: LiteRT-LM was tested on phones only this way
			useLegacyPackaging = true
		}
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

	kotlinOptions {
		jvmTarget = "17"
		// LiteRT-LM is built with Kotlin 2.4, the project compiles with 2.1
		freeCompilerArgs += ["-Xskip-metadata-version-check"]
	}

	buildFeatures {
		buildConfig true
	}

	lintOptions {
		abortOnError false
	}

	sourceSets {
		main {
			manifest.srcFile "AndroidManifest.xml"
			java.srcDirs = ["src"]
			res.srcDirs = ["res"]
			assets.srcDirs = ["bridge", "assets"]
		}
		debug {
			res.srcDirs = ["res-debug"]
			java.srcDirs = ["src-debug"]
			manifest.srcFile "AndroidManifest-debug.xml"
		}
	}

	buildTypes {
		debug {
			signingConfig signingConfigs.development
			// a debug build runs next to the released connector: own package, port and name
			applicationIdSuffix ".debug"
			buildConfigField "int", "MCP_PORT", "8766"
			buildConfigField "String", "SERVICE_SUFFIX", "\" (debug)\""
		}
		release {
			signingConfig signingConfigs.release
			buildConfigField "int", "MCP_PORT", "8765"
			buildConfigField "String", "SERVICE_SUFFIX", "\"\""
		}
	}
}

dependencies {
	implementation project(path: ':OsmAnd-api')
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.14.0'
	implementation 'org.nanohttpd:nanohttpd:2.3.1'
	implementation 'androidx.recyclerview:recyclerview:1.4.0'
	// Gemini Nano through Android AICore; beta2 is the last one built with a Kotlin this project can read
	implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
	// LiteRT-LM runs .litertlm models on the GPU; 0.19+ is needed by the current model files; 0.20 is Java 25 bytecode, too new for this build
	implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.1'
}
